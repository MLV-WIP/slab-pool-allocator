# Display name may include '+'. Callers of workflow_run must escape it
# (e.g. 'C\+\+ CI') — see actions/runner#3763. Avoid '/' in the name.
name: C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    #runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm64' || 'ubuntu-latest' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        #arch: [amd64, arm64]
        arch: [amd64]
        compiler: [clang, gcc]
        # auto = newest dialect the toolchain accepts; c++20 pins the floor.
        cxxstd: [auto, c++20]
        # memsan is a valid local BUILD_TYPE but omitted here: it needs an
        # MSan-instrumented C++ runtime and gtest from the host toolchain.
        sanitizer-config:
          - name: release
            enable-flags: "--enable-coverage"
            build-type: "release"
            # Optimized -DNDEBUG path (exercises release-only control flow)
            # plus gcov/llvm-cov coverage instrumentation.
            container-options: ""
          - name: addrsan
            enable-flags: "--enable-asan --enable-lsan --enable-ubsan"
            build-type: "addrsan"
            # No special container privileges needed for ASan/UBSan.
            container-options: ""
          - name: threadsan
            enable-flags: "--enable-tsan"
            build-type: "threadsan"
            # Privileged so we can lower vm.mmap_rnd_bits for TSan on
            # modern Ubuntu hosts (default 32 breaks older/container TSan).
            container-options: "--privileged"

    container:
      image: ghcr.io/mlv-wip/${{ matrix.compiler }}-builder:latest
      options: ${{ matrix.sanitizer-config.container-options }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Limit mmap ASLR entropy for ThreadSanitizer
      if: matrix.sanitizer-config.name == 'threadsan'
      run: |
        echo "Current vm.mmap_rnd_bits=$(sysctl -n vm.mmap_rnd_bits)"
        sysctl -w vm.mmap_rnd_bits=28
        echo "Updated vm.mmap_rnd_bits=$(sysctl -n vm.mmap_rnd_bits)"
    - name: configure (${{ matrix.sanitizer-config.name }}, cxxstd=${{ matrix.cxxstd }})
      run: ./configure ${{ matrix.sanitizer-config.enable-flags }} --enable-tests --enable-demo --build-type=${{ matrix.sanitizer-config.build-type }} --with-cxxstd=${{ matrix.cxxstd }}
    - name: make
      run: make
    - name: make test
      run: make test
    - name: coverage report
      if: matrix.sanitizer-config.name == 'release'
      run: make coverage
