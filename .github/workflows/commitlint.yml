# Thin wrapper: Conventional Commits via shared MLV-WIP/release-tooling.
name: Commitlint

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Conventional Commits
    uses: MLV-WIP/release-tooling/.github/workflows/commitlint.yml@v1.0.0
    with:
      print-git-describe: true
